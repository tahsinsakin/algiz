<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#050505"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>ALGIZ</title>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="icon" href="./rune.svg"/>
<style>
:root{--bg:#050505;--red:#D32F2F;--ink:#E0E0E0;--dim:#888}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,sans-serif;min-height:100%}
#gate,#app{min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
#app{display:none;max-width:430px;margin:0 auto}
#gate{max-width:430px;margin:0 auto;display:flex;flex-direction:column;justify-content:center}
h1{margin:0 0 8px;color:var(--red);letter-spacing:.42em;font-size:28px;text-align:center;font-weight:900}
.rune{display:block;width:84px;height:118px;margin:0 auto 28px}
.quote{border-left:4px solid var(--red);padding:0 0 0 16px;margin:0 0 28px}
.quote p{font-size:22px;font-style:italic;line-height:1.35;margin:0}
.quote span{display:block;color:var(--dim);letter-spacing:.16em;text-transform:uppercase;font-size:12px;margin-top:12px}
label.mandate{display:flex;gap:12px;align-items:center;justify-content:center;margin:0 0 24px;text-transform:uppercase;font-weight:600}
button{width:100%;border:0;background:var(--red);color:#fff;padding:18px;font-weight:900;letter-spacing:.22em}
button:disabled{background:#222;color:#666}
.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #1a1a1a;padding:12px 0;font-size:14px}
.score{font-size:72px;color:var(--red);text-align:center;margin:4px 0;font-weight:900;letter-spacing:-.04em}
input,select{background:#111;color:#fff;border:1px solid #333;padding:12px;width:100%;margin:0 0 10px;font:inherit}
.muted{color:var(--dim);font-size:13px}
nav{display:flex;gap:8px;margin:0 0 16px}
nav button{flex:1;letter-spacing:.08em;font-size:11px;padding:12px}
.panel{display:none}.panel.on{display:block}
a{color:var(--red)}
</style>
</head>
<body>
<section id="gate">
  <img class="rune" src="./rune.svg" alt="Algiz rune"/>
  <h1>ALGIZ</h1>
  <div class="quote">
    <p id="q">To achieve the extraordinary, you must endure the unreasonable.</p>
    <span id="qa">Mike Mentzer</span>
  </div>
  <label class="mandate"><input id="ok" type="checkbox"/> I read it. I understand.</label>
  <button id="enter" type="button" disabled>ENTER THE CRUCIBLE</button>
  <p class="muted" style="text-align:center;margin-top:24px">Not a medical device. Training heuristic only.</p>
</section>
<section id="app">
  <img class="rune" src="./rune.svg" alt="" style="width:48px;height:68px;margin-bottom:8px"/>
  <h1>ALGIZ</h1>
  <p class="muted" style="text-align:center">CNS master · muscle workers</p>
  <div class="score" id="score">100</div>
  <p class="muted" id="swap" style="text-align:center;margin-bottom:20px"></p>
  <nav>
    <button type="button" data-p="lift">LIFT</button>
    <button type="button" data-p="supp">SUPP</button>
    <button type="button" data-p="heat">HEAT</button>
  </nav>
  <div class="panel on" id="lift">
    <input id="move" placeholder="SQUAT_BB" autocomplete="off"/>
    <input id="sets" type="number" inputmode="numeric" placeholder="Sets"/>
    <input id="reps" type="number" inputmode="numeric" placeholder="Reps"/>
    <input id="rpe" type="number" inputmode="decimal" step="0.5" placeholder="RPE"/>
    <input id="kg" type="number" inputmode="decimal" placeholder="Load kg"/>
    <button type="button" id="logLift">LOG SET</button>
    <div id="lifts"></div>
  </div>
  <div class="panel" id="supp">
    <input id="comp" placeholder="caffeine" autocomplete="off"/>
    <input id="mg" type="number" inputmode="decimal" placeholder="Dose mg"/>
    <input id="hl" type="number" inputmode="decimal" step="0.1" placeholder="Half-life hours"/>
    <button type="button" id="logSupp">LOG DOSE</button>
    <div id="supps"></div>
  </div>
  <div class="panel" id="heat">
    <select id="amenity"><option>SAUNA</option><option>STEAM_ROOM</option><option>POOL</option></select>
    <input id="mins" type="number" inputmode="numeric" placeholder="Minutes"/>
    <button type="button" id="logHeat">LOG HEAT</button>
    <div id="heats"></div>
  </div>
  <p class="muted" style="margin-top:28px"><a href="./privacy.html">Privacy</a> · device vault · no account</p>
</section>
<script src="./quotes.js"></script>
<script src="./vault.js"></script>
<script src="./cns.js"></script>
<script src="./app.js"></script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");</script>
</body>
</html>
